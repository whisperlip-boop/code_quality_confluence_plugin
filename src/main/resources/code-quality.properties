cq.section.legacy=Legacy metrics - what this replaces
cq.legacy.note=All four divide by lines of code or by function count. Read them against the metrics below: when these stay flat or improve while those move, that is the gap this exists to close. Deliberately ungraded.
cq.legacy.duplicates=Duplicates
cq.legacy.duplicates.miss=A ratio: it hides growth whenever the codebase grows as fast as the duplication does.
cq.legacy.complexity=Cyclomatic complexity
cq.legacy.complexity.miss=Per function: blind to the shape where every function is simple but the same logic sits in several of them.
cq.legacy.commentDensity=Comment density
cq.legacy.commentDensity.miss=Generated code comments heavily, so this rises while maintainability falls.
cq.legacy.functionLength=Average function length
cq.legacy.functionLength.miss=More, shorter functions scores better and means nothing if they are not wired together.
