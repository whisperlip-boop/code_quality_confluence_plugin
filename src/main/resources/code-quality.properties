cq.finding.crossFileClone.title=The same block lives in {0} and {2}
cq.finding.crossFileClone.body={5} cross-file clone group(s); the largest is {4} lines, at {0}:{1} and {2}:{3}. Fixing one side leaves the other behind - this is the shape that produces "we already fixed that" bugs.
cq.finding.cloneConcentration.title={2}% of all duplication sits in {0}
cq.finding.cloneConcentration.body={1} of {3} duplicated lines are in this one file. Concentrated duplication is usually one construct copied per variant, which is cheaper to fix than scattered duplication.
cq.finding.errorHandling.title=Error handling: {4} suppressing handlers per KLOC
cq.finding.errorHandling.body=Bare handlers {0}, over-broad {1}, empty or log-only bodies {2}, explicit suppression {3}. This is the axis that usually degrades in generated code, so the number matters more as a direction than as a level.
cq.finding.connectivityDrift.title=Function connectivity moved {2}% over {3} days
cq.finding.connectivityDrift.body={0} to {1} calls per KLOC. Falling connectivity means new code is handling things itself rather than calling what already exists. This is an approximation over call-shaped tokens, not resolved symbols, so treat a small move as noise.
cq.finding.busFactor.title=Bus factor {0}, across {1} author(s)
cq.finding.busFactor.body={3} accounts for {4} commits. Git reported {2} raw identities for {1} people, so identity merging is already doing work here - without it ownership and bus factor would both be wrong.
cq.finding.busFactorClean.title=Bus factor {0}, across {1} author(s)
cq.finding.busFactorClean.body={3} accounts for {4} commits. Every author resolved to a single git identity, so this count is what the history says without any merging applied.
cq.finding.churnSpike.title={0} was {2}% rewritten within two weeks
cq.finding.churnSpike.body="{1}" - {3} of {4} added lines were rewritten, against a repository average of {5}%. Shipping and immediately reworking is the pattern churn is built to catch, and it catches it without reading the commit message.
cq.finding.identitySuspects.title={0} and {1} may be the same person
cq.finding.identitySuspects.body={2} pair(s) of git identities share a name or an email prefix but were counted separately, because a prefix rule that merges them also merges two genuinely different people - and a wrongly merged author corrupts ownership exactly as badly as a wrongly split one. Add a .mailmap to the repository and the next run will fold them; until then ownership and bus factor are counted per identity.
cq.finding.copyPasteHigh.title=Copy-paste ratio is {0}%
cq.finding.copyPasteHigh.body={1} of {2} added lines arrived as blocks that already existed. The refactoring ratio is {3}%, so the code is being duplicated rather than moved.
cq.caveat.mirrorTrees.title={0} mirrored subtree(s) left out of the duplication measurement
cq.caveat.mirrorTrees.body={2} - {1} lines held at the same relative paths as another subtree, and matching after normalisation. Measured whether the repository keeps a second copy of a library for another platform, vendors a dependency, or clones a package per build target: the ratio would otherwise be a statement about the layout rather than the code. The ratio is over the remaining {3} lines, and the copy-paste ratio still counts a line added to both copies, because that is work done twice.
cq.caveat.rightCensoring.title=Right-censoring
cq.caveat.rightCensoring.body={0} commit(s) are newer than {1} days, so their churn cannot be measured to the end. Those points are greyed out and excluded from the average: 0% there means "not known yet", not "clean". Without this, the newest commits would always look healthiest.
cq.caveat.importExcluded.title=Bulk imports excluded
cq.caveat.importExcluded.body={0} commit(s) totalling {1} lines were detected as bulk imports and left out of every ratio. Including a single commit that lands a whole codebase makes every ratio meaningless.
cq.caveat.sampleSize.title=Sample size
cq.caveat.sampleSize.body={0} commits over {1} days by {2} author(s). Read the direction, not the slope - and compare against your own repositories rather than an industry figure.
cq.caveat.approximation.title=What is approximate
cq.caveat.approximation.body=Error-swallowing and connectivity come from a line scanner with block tracking, not a parser: a Confluence plugin runs in the JVM and cannot load a native grammar. Duplication uses normalised line-window hashing rather than a token-level clone detector. Copy-paste, refactoring and churn are exact given the normalisation rules.
cq.caveat.aiAttribution.title=AI contribution is not measured
cq.caveat.aiAttribution.body=There is no reliable way to tell from a diff which lines a model wrote. Commit-size and typing-speed heuristics are not trustworthy. This only becomes measurable through a commit trailer convention, which is a process decision rather than a tooling one - and the share of AI-written code is not a quality metric in either direction.
cq.caveat.firstParent.title=History is read along first parents
cq.caveat.firstParent.body=A merge commit is analyzed as one change against its branch point, so in a pull-request workflow a whole PR is attributed to its merge. This keeps the tree state linear, which is what makes incremental analysis possible.
