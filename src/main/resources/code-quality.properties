cq.label.levelBasis=Warn at {0}%: the 75th percentile of {2} public {3} repositories. Act at {1}%: the 90th percentile of all {4} repositories measured, pooled across languages because a per-language 90th percentile moves by up to 3 points when one repository is dropped, and the pooled one by 0.3. Same detector and same exclusions throughout.
cq.label.noBasisNote=This repository is mostly {0}, and no cohort has been measured for it. A threshold borrowed from another language would be a guess. The number stands on its own; the direction below does not need a threshold.
cq.label.floorNote=Changes under {0} lines are reported as no change: a percentage over a small base explodes, and {0} lines is about four clones at this detector's minimum size.
