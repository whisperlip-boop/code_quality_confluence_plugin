cq.kpi.copyPaste=Copy-paste ratio
cq.kpi.copyPaste.note=Share of added lines that already existed elsewhere as a block of three or more lines. Judged per block, not per line: a line-level rule flags every language idiom.
cq.kpi.refactor=Refactoring ratio
cq.kpi.refactor.note=Moved / (moved + copied). Code that left its old home is refactoring; code that now exists twice is not.
cq.kpi.churn=Two-week churn
cq.kpi.churn.note=Share of added lines rewritten within 14 days. Commits newer than 14 days are excluded, because their window has not closed.
cq.kpi.duplication=Duplicated lines
cq.kpi.duplication.note=Absolute count first, ratio second. The ratio hides growth whenever the codebase grows at the same rate as the duplication.
cq.kpi.errorSwallow=Error-swallowing density
cq.kpi.errorSwallow.note=Bare handlers, over-broad handlers, empty bodies and log-and-continue, per KLOC.
cq.kpi.connectivity=Function connectivity
cq.kpi.connectivity.note=Call-shaped tokens per KLOC. An approximation, not a call graph: falling connectivity suggests new code handling things itself instead of calling what exists.
