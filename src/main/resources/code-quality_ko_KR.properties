cq.caveat.mirrorTrees.body={2} \u2014 \ub2e4\ub978 \uc11c\ube0c\ud2b8\ub9ac\uc640 \uac19\uc740 \uc0c1\ub300\uacbd\ub85c\uc5d0 \uc788\uace0 \uc815\uaddc\ud654 \ud6c4 \ub0b4\uc6a9\uc774 \uc77c\uce58\ud558\ub294 {1}\uc904\uc774\ub2e4. \ub2e4\ub978 \ud50c\ub7ab\ud3fc\uc6a9 \uc0ac\ubcf8, \ubca4\ub354\ub9c1\ub41c \uc758\uc874\uc131, \ube4c\ub4dc \ud0c0\uae43\ubcc4 \ubcf5\uc81c \uc911 \ubb34\uc5c7\uc774\ub4e0 \uac19\uc740 \ud615\ud0dc\ub85c \uc7a1\ud78c\ub2e4. \uadf8\ub300\ub85c \uc7ac\uba74 \ube44\uc728\uc774 \ucf54\ub4dc\uac00 \uc544\ub2c8\ub77c \ub514\ub809\ud130\ub9ac \uad6c\uc870\uc5d0 \ub300\ud55c \uc9c4\uc220\uc774 \ub41c\ub2e4. \ube44\uc728\uc740 \ub0a8\uc740 {3}\uc904 \uae30\uc900\uc774\uace0, \uc591\ucabd\uc5d0 \uac19\uc774 \ucd94\uac00\ud55c \ub77c\uc778\uc740 \ubcf5\uc0ac\u00b7\ubd99\uc5ec\ub123\uae30 \ube44\uc728\uc5d0 \uadf8\ub300\ub85c \ub0a8\ub294\ub2e4 \u2014 \ub450 \ubc88 \ud55c \uc77c\uc774\uae30 \ub54c\ubb38\uc774\ub2e4.
cq.caveat.historyTruncated.title=\ucd5c\uadfc \ucee4\ubc0b {0}\uac1c\ub9cc \ubd84\uc11d\ud588\ub2e4
cq.caveat.historyTruncated.body=\uc774 \ud788\uc2a4\ud1a0\ub9ac\ub294 \ud55c \ubc88\uc758 \ubd84\uc11d\uc774 \ud6d1\ub294 \uae38\uc774\ubcf4\ub2e4 \uae38\ub2e4. \ub530\ub77c\uc11c \uc704\uc758 \ubaa8\ub4e0 \uc218\uce58 \u2014 \uae30\uac04, \ucee4\ubc0b \uc218, \uc791\uc131\uc790, \ucd94\uc138 \u2014 \ub294 \ub808\ud3ec\uc9c0\ud130\ub9ac \uc804\uccb4\uac00 \uc544\ub2c8\ub77c \uadf8 \uad6c\uac04\uc5d0 \ub300\ud55c \uac83\uc774\ub2e4. \uc774 \uc0c1\ud55c\uc740 \ud0d0\uc0c9 \ubc94\uc704\uc640 \ud55c \ubc88\uc758 \uc2e4\ud589\uc774 \uc810\uc720\ud558\ub294 \uba54\ubaa8\ub9ac, \ud55c \ud2b8\ub79c\uc7ad\uc158\uc774 \uc4f0\ub294 \ud589 \uc218\ub97c \ubb36\ub294\ub2e4. \uad6c\uac04 \uc548\uc758 \uc218\uce58 \uacc4\uc0b0 \ubc29\uc2dd\uc740 \ud3c9\uc18c\uc640 \uac19\ub2e4.
cq.caveat.rightCensoring.title=\uc624\ub978\ucabd \uc808\ub2e8(right-censoring)
cq.caveat.rightCensoring.body={0}\uac1c \ucee4\ubc0b\uc774 {1}\uc77c\ubcf4\ub2e4 \ucd5c\uadfc\uc774\ub77c churn\uc744 \ub05d\uae4c\uc9c0 \uce21\uc815\ud560 \uc218 \uc5c6\ub2e4. \ud574\ub2f9 \uad6c\uac04\uc740 \ud68c\uc0c9\uc73c\ub85c \ud45c\uc2dc\ud558\uace0 \ud3c9\uade0\uc5d0\uc11c \uc81c\uc678\ud588\ub2e4. \uc5ec\uae30\uc11c 0%\ub294 "\uc88b\ub2e4"\uac00 \uc544\ub2c8\ub77c "\uc544\uc9c1 \ubaa8\ub978\ub2e4"\ub2e4. \uc774 \ucc98\ub9ac\ub97c \ube7c\uba74 \ucd5c\uc2e0 \ucee4\ubc0b\uc774 \ud56d\uc0c1 \uac00\uc7a5 \uac74\uac15\ud574 \ubcf4\uc778\ub2e4.
cq.caveat.importExcluded.title=\uc77c\uad04 \ubcc0\uacbd \ucee4\ubc0b \uc81c\uc678
cq.caveat.importExcluded.body=\ucee4\ubc0b {0}\uac1c, {1}\uc904\uc740 \ub204\uad70\uac00\uc758 \uc791\uc5c5\uc774 \uc544\ub2c8\ub77c \ucf54\ub4dc \ub369\uc5b4\ub9ac\ub85c \ub4e4\uc5b4\uc628 \uac83\uc774\ub77c \ubaa8\ub4e0 \ube44\uc728\uc5d0\uc11c \uc81c\uc678\ud588\ub2e4. \ucd5c\ucd08 \ubc18\uc785, \uc7ac\uc791\uc131, \ubca4\ub354\ub9c1\ub41c \uc758\uc874\uc131, \ub610\ub294 formatter\ucc98\ub7fc \ub808\ud3ec\uc9c0\ud130\ub9ac \uc804\uccb4\ub97c \ud6d1\ub294 \uae30\uacc4\uc801 \ubcc0\uacbd\uc774 \uc5ec\uae30 \ud574\ub2f9\ud55c\ub2e4. \ucf54\ub4dc\ubca0\uc774\uc2a4 \uc804\uccb4\ub97c \ub123\ub294 \ucee4\ubc0b \ud558\ub098\uac00 \uc774 \ud398\uc774\uc9c0\uc758 \ubaa8\ub4e0 \ube44\uc728\uc744 \uacb0\uc815\ud574\ubc84\ub9ac\uae30 \ub54c\ubb38\uc774\ub2e4. \ud30c\uc77c \uc0ac\uc774\uc5d0\uc11c \ucf54\ub4dc\ub97c \uc62e\uae30\uae30\ub9cc \ud55c \ucee4\ubc0b\uc740 \uc5ec\uae30 \ub4e4\uc5b4\uac00\uc9c0 \uc54a\ub294\ub2e4 \u2014 \uadf8\uac74 \ub9ac\ud329\ud130\ub9c1\uc774\uace0, \uc9d1\uacc4\uc5d0 \ud3ec\ud568\ub41c\ub2e4.
cq.caveat.sampleSize.title=\ud45c\ubcf8 \ud06c\uae30
cq.caveat.sampleSize.body={2}\uba85\uc774 {1}\uc77c\uac04 {0}\uac1c \ucee4\ubc0b. \uae30\uc6b8\uae30\uac00 \uc544\ub2c8\ub77c \ubc29\ud5a5\uc73c\ub85c \uc77d\uc744 \uac83. \uc5c5\uacc4 \uc218\uce58\ubcf4\ub2e4 \uc0ac\ub0b4 \ub2e4\ub978 \ub808\ud3ec\uc640 \ube44\uad50\ud558\ub294 \uac8c \ub9de\ub2e4.
cq.caveat.approximation.title=\uadfc\uc0ac\uc778 \ud56d\ubaa9
cq.caveat.approximation.body=\uc5d0\ub7ec \uc740\ud3d0\uc640 \uc5f0\uacb0\ub3c4\ub294 \ud30c\uc11c\uac00 \uc544\ub2c8\ub77c \ube14\ub85d \ucd94\uc801\uc774 \ubd99\uc740 \ub77c\uc778 \uc2a4\uce90\ub108\ub85c \ubf51\ub294\ub2e4. Confluence \ud50c\ub7ec\uadf8\uc778\uc740 JVM \uc548\uc5d0\uc11c \ub3cc\uc544 \ub124\uc774\ud2f0\ube0c \ubb38\ubc95\uc744 \ubabb \uc2e3\ub294\ub2e4. \uc911\ubcf5\uc740 \ud1a0\ud070 \ub2e8\uc704 \ud074\ub860 \ud0d0\uc9c0\uae30\uac00 \uc544\ub2c8\ub77c \uc815\uaddc\ud654 \ub77c\uc778 \uc708\ub3c4\uc6b0 \ud574\uc2f1\uc744 \uc4f4\ub2e4. \ubcf5\uc0ac\u00b7\ubd99\uc5ec\ub123\uae30, \ub9ac\ud329\ud130\ub9c1, churn\uc740 \uc815\uaddc\ud654 \uaddc\uce59 \uc548\uc5d0\uc11c \uc815\ud655\ud558\ub2e4.
cq.caveat.aiAttribution.title=AI \uae30\uc5ec\ub3c4\ub294 \uce21\uc815\ud558\uc9c0 \uc54a\ub294\ub2e4
cq.caveat.aiAttribution.body=diff\ub9cc \ubcf4\uace0 \uc5b4\ub290 \ub77c\uc778\uc744 \ubaa8\ub378\uc774 \uc37c\ub294\uc9c0 \uac00\ub9b4 \ubc29\ubc95\uc740 \uc5c6\ub2e4. \ucee4\ubc0b \ud06c\uae30\ub098 \uc785\ub825 \uc18d\ub3c4 \ud734\ub9ac\uc2a4\ud2f1\uc740 \uc2e0\ub8b0\ud560 \uc218 \uc5c6\ub2e4. \ucee4\ubc0b \ud2b8\ub808\uc77c\ub7ec \uaddc\uc57d\uc73c\ub85c\ub9cc \uce21\uc815 \uac00\ub2a5\ud574\uc9c0\ub294\ub370 \uadf8\uac74 \ub3c4\uad6c\uac00 \uc544\ub2c8\ub77c \ud504\ub85c\uc138\uc2a4 \ubb38\uc81c\ub2e4. \uadf8\ub9ac\uace0 AI \uc791\uc131 \ube44\uc728 \uc790\uccb4\ub294 \ub192\ub4e0 \ub0ae\ub4e0 \ud488\uc9c8 \uc9c0\ud45c\uac00 \uc544\ub2c8\ub2e4.
cq.caveat.firstParent.title=\ud788\uc2a4\ud1a0\ub9ac\ub294 first-parent\ub85c \uc77d\ub294\ub2e4
cq.caveat.firstParent.body=\uba38\uc9c0 \ucee4\ubc0b\uc740 \ubd84\uae30\uc810 \ub300\ube44 \ud55c \ubc88\uc758 \ubcc0\uacbd\uc73c\ub85c \ubd84\uc11d\ud55c\ub2e4. PR \uc6cc\ud06c\ud50c\ub85c\uc5d0\uc11c\ub294 PR \uc804\uccb4\uac00 \uba38\uc9c0 \ucee4\ubc0b\uc5d0 \uadc0\uc18d\ub41c\ub2e4. \ud2b8\ub9ac \uc0c1\ud0dc\ub97c \uc120\ud615\uc73c\ub85c \uc720\uc9c0\ud574\uc57c \uc99d\ubd84 \ubd84\uc11d\uc774 \uac00\ub2a5\ud558\uae30 \ub54c\ubb38\uc774\ub2e4.
